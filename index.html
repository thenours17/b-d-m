r will restart the DataNode"], "answer": 0, "source": "Midterm 2024"}, {"q": "Identify the node which acts as a checkpoint node in HDFS.", "options": ["Data node", "Secondary data node", "Secondary Name node", "Name node"], "answer": 2, "source": "Midterm 2024"}, {"q": "For YARN to work, we need to start at least 1 _________ and 1 ________.", "options": ["ResourceManager and NodeManager", "ResourceManager and Application master", "Node Manager and Application master", "Resource Manager and Container"], "answer": 0, "source": "Midterm 2024"}, {"q": "What does the term ‘block’ refer to in HDFS?", "options": ["A collection of files", "A method of data encryption", "A logical division of a data file", "A fixed-size chunk of data stored in HDFS"], "answer": 3, "source": "Midterm 2024"}, {"q": "Which of the following has occupied the place of JobTracker of MRV1", "options": ["ResourceManager", "ApplicationMaster", "NodeManager", "Scheduler"], "answer": 0, "source": "Midterm 2024"}, {"q": "What happens if a number of reducers are set to 0?", "options": ["Reducer output will be the final output", "Map-only job take place", "Reducer-only job take place"], "answer": 1, "source": "Midterm 2024"}, {"q": "Who reports node status back to ResourceManager?", "options": ["Container", "Mapreduce", "NodeManager", "App master"], "answer": 2, "source": "Midterm 2024"}, {"q": "Which of the following is a method for analyzing data in which the data is split into smaller subsets and processed in parallel across multiple servers or nodes?", "options": ["Stream Processing", "Hive", "Batch Processing", "MapReduce"], "answer": 3, "source": "Midterm 2024"}, {"q": "Point out the correct statement.", "options": ["MapReduce tries to place the data and the compute as close as possible", "Map Task in MapReduce is performed using the Mapper() function", "Reduce Task in MapReduce is performed using the Map() function", "All of the mentioned"], "answer": 0, "source": "Midterm 2024"}, {"q": "Which among the following are the features of Hadoop:", "options": ["Open source", "Fault-tolerant", "All of them", "High Availability"], "answer": 2, "source": "Midterm 2024"}, {"q": "What is the role of the Mapper class in a Word Count program?", "options": ["To split input data and produce intermediate key-value pairs", "To handle errors during input processing", "To output the final word counts", "To tokenize input and write it to HDFS directly"], "answer": 0, "source": "Midterm 2024"}, {"q": "What is the main purpose of a container in YARN?", "options": ["To manage Hadoop configuration files", "To run specific tasks assigned by the ResourceManager", "To handle data replication", "To store large data sets"], "answer": 1, "source": "Midterm 2024"}, {"q": "What is the primary function of the Map phase in MapReduce?", "options": ["To sort and shuffle data", "To process data", "To distribute data", "To combine results"], "answer": 1, "source": "Midterm 2024"}];const $=id=>document.getElementById(id);let mode='study',pool=[],index=0,score=0,wrong=[],answered=false;const key='bigDataCombinedWrong_v1';$('total').textContent=BANK.length;
const sources=['All 3 files',...new Set(BANK.map(x=>x.source))];sources.forEach(s=>{let o=document.createElement('option');o.value=s;o.textContent=s+' ('+(s==='All 3 files'?BANK.length:BANK.filter(x=>x.source===s).length)+')';$('sourceSelect').appendChild(o)});
function saved(){try{return JSON.parse(localStorage.getItem(key)||'[]')}catch{return []}}
function selectMode(m){mode=m;if(m==='wrong'){pool=saved();if(!pool.length){alert('No wrong questions saved yet.');return}begin();return}$('setup').classList.remove('hidden');$('sourceSelect').value=m==='source'?sources[1]:sources[0];$('count').value=m==='exam'?50:BANK.length}
function shuffled(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function start(){let a=$('sourceSelect').value===sources[0]?BANK:BANK.filter(x=>x.source===$('sourceSelect').value);let n=Math.max(1,Math.min(Number($('count').value)||a.length,a.length));pool=($('shuffle').checked?shuffled(a):[...a]).slice(0,n);begin()}
function begin(){index=0;score=0;wrong=[];$('home').classList.add('hidden');$('end').classList.add('hidden');$('quiz').classList.remove('hidden');render()}
function render(){answered=false;let x=pool[index];$('source').textContent=x.source+' · Question '+(index+1)+' / '+pool.length;$('question').textContent=x.q;$('options').innerHTML='';$('feedback').textContent='';$('feedback').className='feedback';$('next').disabled=true;$('show').disabled=false;$('next').textContent=index===pool.length-1?'Finish':'Next →';x.options.forEach((o,i)=>{let b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+i)+'. '+o;b.onclick=()=>answer(i);$('options').appendChild(b)});stats()}
function stats(){$('position').textContent='Question '+(index+1)+'/'+pool.length;$('score').textContent='Correct: '+score;$('wrongCount').textContent='Wrong: '+wrong.length;$('bar').style.width=((index+(answered?1:0))/pool.length*100)+'%'}
function reveal(k){let x=pool[index],bs=[...$('options').children];bs.forEach(b=>b.disabled=true);bs[x.answer].classList.add('correct');if(k!==null&&k!==x.answer)bs[k].classList.add('wrong');answered=true;$('next').disabled=false;$('show').disabled=true;stats()}
function answer(k){if(answered)return;let x=pool[index];if(k===x.answer){score++;$('feedback').textContent='Correct ✓';$('feedback').className='feedback good'}else{wrong.push(x);$('feedback').textContent='Wrong ✕ — Correct answer: '+x.options[x.answer];$('feedback').className='feedback bad'}reveal(k)}
function showAnswer(){if(answered)return;let x=pool[index];wrong.push(x);$('feedback').textContent='Correct answer: '+x.options[x.answer];reveal(null)}
function next(){if(!answered)return;if(index+1<pool.length){index++;render()}else finish()}
function finish(){$('quiz').classList.add('hidden');$('end').classList.remove('hidden');$('result').textContent='Score: '+score+' / '+pool.length+' ('+Math.round(score/pool.length*100)+'%). Wrong: '+wrong.length;localStorage.setItem(key,JSON.stringify(wrong))}
function retryWrong(){pool=wrong.length?wrong:saved();if(!pool.length){alert('No wrong questions');return}begin()}
function homePage(){$('quiz').classList.add('hidden');$('end').classList.add('hidden');$('home').classList.remove('hidden');$('setup').classList.add('hidden')}
</script></body></html>
